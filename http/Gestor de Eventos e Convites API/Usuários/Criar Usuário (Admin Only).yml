info:
  name: Criar Usuário (Admin Only)
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/usuarios
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "nome": "Fulano Organizador",
        "email": "organizador@teste.com",
        "senha": "123456",
        "perfil": "ORGANIZADOR"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
