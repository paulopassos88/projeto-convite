server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: api-convite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convite_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

api:
  security:
    token:
      secret: ${JWT_SECRET:12345678901234567890123456789012}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:convite.exchange}
    queue: ${RABBITMQ_QUEUE:convite.email.enviar.queue}
    routing-key: ${RABBITMQ_ROUTING_KEY:convite.email.enviar}

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [%clr(%X{usuarioEmail:-anonimo}){magenta}] %m%n%wEx"

