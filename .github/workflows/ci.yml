name: CI - Build e Testes de Integração

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-build:
    name: Build & Testcontainers
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api-convite

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Configurar Gradle com Cache Inteligente
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de Execução para o Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Executar Testes de Integração e Compilação
        run: ./gradlew check --no-daemon

      - name: Publicar Relatório de Testes em caso de Falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-falhos
          path: api-convite/build/reports/tests/test/
